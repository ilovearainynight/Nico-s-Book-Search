<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Price Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #faf9f7;
      color: #1a1816;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: 5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Search */
    .search-box {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    #searchInput {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e5e0d8;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      background: #faf9f7;
      color: #1a1816;
      outline: none;
      -webkit-appearance: none;
    }

    #searchInput:focus {
      border-color: #b8532f;
    }

    .search-btn {
      padding: 0 1.25rem;
      border: none;
      border-radius: 8px;
      background: #b8532f;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Book Card */
    .book-card {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .book-card.show { display: block; }

    .book-top {
      display: flex;
      gap: 1rem;
    }

    .book-cover {
      width: 80px;
      height: 120px;
      border-radius: 6px;
      background: #f5f3f0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 2rem;
    }
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info { flex: 1; }

    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .book-author {
      color: #6b6560;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .book-isbn {
      display: inline-block;
      font-size: 0.75rem;
      font-family: monospace;
      color: #9a9590;
      background: #f5f3f0;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    /* In-store price */
    .in-store {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e0d8;
    }

    .in-store-label {
      font-size: 0.85rem;
      color: #6b6560;
    }

    #inStoreInput {
      width: 80px;
      padding: 8px;
      border: 2px solid #e5e0d8;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      background: #faf9f7;
      color: #1a1816;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
    }

    #inStoreInput:focus {
      border-color: #b8532f;
    }

    .save-btn {
      margin-left: auto;
      padding: 8px 12px;
      border: 2px solid #b8532f;
      border-radius: 6px;
      background: transparent;
      color: #b8532f;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Prices */
    .prices-section {
      margin-top: 1rem;
    }

    .prices-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .price-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f5f3f0;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      text-decoration: none;
      color: inherit;
      border: 1px solid transparent;
    }
    .price-item:hover {
      border-color: #b8532f;
    }
    .price-item.best {
      background: #e5f5ea;
      border-color: #1e7a35;
    }

    .price-site {
      font-weight: 500;
    }

    .price-note {
      font-size: 0.75rem;
      color: #9a9590;
    }

    .price-amount {
      font-weight: 600;
      font-size: 1.1rem;
    }
    .price-item.best .price-amount {
      color: #1e7a35;
    }

    .price-loading {
      color: #9a9590;
      font-size: 0.85rem;
      padding: 1rem 0;
    }

    .savings-tag {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 2px 6px;
      background: #1e7a35;
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      border-radius: 4px;
    }

    /* Site buttons */
    .site-buttons {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e5e0d8;
    }

    .site-buttons-title {
      font-size: 0.8rem;
      color: #9a9590;
      margin-bottom: 0.5rem;
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .site-btn {
      padding: 8px 12px;
      border: 1px solid #e5e0d8;
      border-radius: 6px;
      background: #fff;
      color: #1a1816;
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }

    .multi-btn {
      width: 100%;
      padding: 12px;
      margin-top: 0.75rem;
      border: 2px solid #9a6700;
      border-radius: 8px;
      background: #fef6e6;
      color: #9a6700;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e5e0d8;
      display: flex;
      justify-content: center;
      gap: 4rem;
      padding: 10px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      border: none;
      background: none;
      color: #9a9590;
      font-family: inherit;
      font-size: 0.65rem;
      cursor: pointer;
      position: relative;
    }
    .nav-btn .icon { font-size: 1.25rem; }
    .nav-btn.active { color: #b8532f; }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #b8532f;
      color: white;
      font-size: 0.6rem;
      font-weight: 600;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge.hide { display: none; }

    /* Watchlist */
    .watchlist { display: none; }
    .watchlist.show { display: block; }

    .wl-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .wl-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #9a9590;
    }

    .wl-item {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .wl-item-top {
      display: flex;
      gap: 0.75rem;
    }

    .wl-cover {
      width: 50px;
      height: 75px;
      border-radius: 4px;
      background: #f5f3f0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .wl-cover img { width: 100%; height: 100%; object-fit: cover; }

    .wl-info { flex: 1; }

    .wl-item-title {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .wl-item-author {
      font-size: 0.8rem;
      color: #6b6560;
    }

    .wl-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      background: #fef6e6;
      color: #9a6700;
      border-radius: 4px;
      margin-top: 0.25rem;
    }

    .wl-btns {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .wl-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #e5e0d8;
      border-radius: 6px;
      background: #faf9f7;
      color: #1a1816;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .wl-btn.primary { background: #b8532f; color: white; border-color: #b8532f; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1816;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .search-section.hide { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Book Price Check</h1>
    </header>

    <section class="search-section" id="searchSection">
      <div class="search-box">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Title, author, or ISBN..." autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="search-btn" id="searchBtn">🔍</button>
        </div>
      </div>

      <div class="book-card" id="bookCard">
        <div class="book-top">
          <div class="book-cover" id="bookCover">📖</div>
          <div class="book-info">
            <div class="book-title" id="bookTitle">Book Title</div>
            <div class="book-author" id="bookAuthor">by Author</div>
            <div class="book-isbn" id="bookIsbn">ISBN</div>
          </div>
        </div>

        <div class="in-store">
          <span class="in-store-label">In store:</span>
          <input type="text" id="inStoreInput" placeholder="$18" autocomplete="off">
          <button class="save-btn" id="saveBtn">+ Save</button>
        </div>

        <div class="prices-section">
          <div class="prices-title">💰 Best Prices Found</div>
          <div id="pricesList"></div>
        </div>

        <div class="site-buttons">
          <div class="site-buttons-title">Or check manually:</div>
          <div class="btn-row" id="siteLinks"></div>
          <button class="multi-btn" id="multiBtn">🚀 Open Top 4 Sites at Once</button>
        </div>
      </div>
    </section>

    <section class="watchlist" id="watchlist">
      <h2 class="wl-title">📚 Watchlist</h2>
      <div id="wlContent"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="search">
      <span class="icon">🔍</span>
      Search
    </button>
    <button class="nav-btn" data-tab="watchlist">
      <span class="icon">📚</span>
      Watchlist
      <span class="badge hide" id="wlBadge">0</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    // Simple helper
    function getEl(id) {
      return document.getElementById(id);
    }

    function enc(str) {
      return encodeURIComponent(str || '');
    }

    // Sites config
    var SITES = {
      bwb: {
        name: 'Better World Books',
        url: function(t, a, i) { return 'https://www.betterworldbooks.com/search/results?q=' + enc(i || (t + ' ' + (a || '')).trim()); }
      },
      thriftbooks: {
        name: 'ThriftBooks',
        url: function(t, a, i) { return 'https://www.thriftbooks.com/browse/?b.search=' + enc(i || (t + ' ' + (a || '')).trim()); }
      },
      abebooks: {
        name: 'AbeBooks',
        url: function(t, a, i) {
          if (i) return 'https://www.abebooks.com/servlet/SearchResults?isbn=' + i + '&sortby=17';
          return 'https://www.abebooks.com/servlet/SearchResults?kn=' + enc(t) + '&sortby=17' + (a ? '&an=' + enc(a) : '');
        }
      },
      alibris: {
        name: 'Alibris',
        url: function(t, a, i) {
          if (i) return 'https://www.alibris.com/search/books/isbn/' + i + '?sort=p';
          return 'https://www.alibris.com/search/books/subject/Used?qwork=' + enc((t + ' ' + (a || '')).trim()) + '&sort=p';
        }
      },
      bookfinder: {
        name: 'BookFinder ⭐',
        url: function(t, a, i) {
          if (i) return 'https://www.bookfinder.com/search/?isbn=' + i + '&mode=isbn&st=sr&ac=qr';
          return 'https://www.bookfinder.com/search/?title=' + enc(t) + (a ? '&author=' + enc(a) : '') + '&new_used=U&destination=us&currency=USD&mode=basic&st=sr&ac=qr';
        }
      },
      amazon: {
        name: 'Amazon',
        url: function(t, a, i) {
          var q = i || (t + ' ' + (a || '')).trim();
          return 'https://www.amazon.com/s?k=' + enc(q) + '&i=stripbooks&rh=p_n_condition-type%3A1294423011';
        }
      }
    };

    var MULTI_SITES = ['thriftbooks', 'abebooks', 'bwb', 'alibris'];
    var LINK_SITES = ['bookfinder', 'thriftbooks', 'abebooks', 'alibris', 'amazon'];

    // State
    var list = [];
    var book = null;

    // Load saved data
    try {
      list = JSON.parse(localStorage.getItem('bookList') || '[]');
    } catch(e) {
      list = [];
    }

    // Init
    function init() {
      updateBadge();

      getEl('searchBtn').addEventListener('click', doSearch);
      getEl('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') doSearch();
      });
      getEl('saveBtn').addEventListener('click', saveBook);
      getEl('multiBtn').addEventListener('click', openMulti);

      var navBtns = document.querySelectorAll('.nav-btn');
      for (var i = 0; i < navBtns.length; i++) {
        navBtns[i].addEventListener('click', function() {
          switchTab(this.getAttribute('data-tab'));
        });
      }
    }

    // Search
    function doSearch() {
      var q = getEl('searchInput').value.trim();
      if (!q) {
        showToast('Enter something to search');
        return;
      }

      getEl('searchBtn').textContent = '...';
      getEl('pricesList').innerHTML = '<div class="price-loading">Searching...</div>';

      fetchBook(q).then(function(result) {
        book = result;

        getEl('bookTitle').textContent = book.title || q;
        getEl('bookAuthor').textContent = book.author ? 'by ' + book.author : '';
        getEl('bookIsbn').textContent = book.isbn || 'No ISBN';
        getEl('bookIsbn').style.display = book.isbn ? 'inline-block' : 'none';
        getEl('bookCover').innerHTML = book.cover ? '<img src="' + book.cover + '">' : '📖';

        updateSiteLinks();
        getEl('bookCard').classList.add('show');

        return fetchPrices();
      }).catch(function(err) {
        console.error(err);
        showToast('Search failed');
        getEl('pricesList').innerHTML = '<div class="price-loading">Error loading prices</div>';
      }).finally(function() {
        getEl('searchBtn').textContent = '🔍';
      });
    }

    function fetchBook(query) {
      return new Promise(function(resolve) {
        var clean = query.replace(/[-\s]/g, '');
        var isIsbn = /^[0-9]{10,13}$/.test(clean);
        var searchQ = isIsbn ? 'isbn:' + clean : query;

        fetch('https://www.googleapis.com/books/v1/volumes?q=' + enc(searchQ) + '&maxResults=1')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.items && data.items[0]) {
              var v = data.items[0].volumeInfo;
              var ids = v.industryIdentifiers || [];
              var isbn13 = null;
              var isbn10 = null;
              for (var i = 0; i < ids.length; i++) {
                if (ids[i].type === 'ISBN_13') isbn13 = ids[i].identifier;
                if (ids[i].type === 'ISBN_10') isbn10 = ids[i].identifier;
              }
              resolve({
                title: v.title,
                author: v.authors ? v.authors.join(', ') : null,
                isbn: isIsbn ? clean : (isbn13 || isbn10),
                cover: v.imageLinks && v.imageLinks.thumbnail ? v.imageLinks.thumbnail.replace('http:', 'https:') : null
              });
            } else {
              resolve({ title: query, author: null, isbn: isIsbn ? clean : null, cover: null });
            }
          })
          .catch(function() {
            resolve({ title: query, author: null, isbn: isIsbn ? clean : null, cover: null });
          });
      });
    }

    function fetchPrices() {
      var prices = [];
      var inStore = parsePrice(getEl('inStoreInput').value);

      if (!book.isbn) {
        getEl('pricesList').innerHTML = '<div class="price-loading">No ISBN found. Use links below to search manually.</div>';
        return Promise.resolve();
      }

      return fetch('https://openlibrary.org/prices?isbn=' + book.isbn)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.betterworldbooks && data.betterworldbooks.price_amt) {
            prices.push({
              site: 'Better World Books',
              price: parseFloat(data.betterworldbooks.price_amt),
              shipping: 'Free shipping',
              url: SITES.bwb.url(book.title, book.author, book.isbn)
            });
          }

          if (prices.length === 0) {
            getEl('pricesList').innerHTML = '<div class="price-loading">No API prices found. Use links below.</div>';
          } else {
            prices.sort(function(a, b) { return a.price - b.price; });
            var html = '';
            for (var i = 0; i < prices.length; i++) {
              var p = prices[i];
              var isBest = i === 0;
              var savings = (inStore && p.price < inStore) ? (inStore - p.price) : null;
              html += '<a href="' + p.url + '" target="_blank" class="price-item ' + (isBest ? 'best' : '') + '">';
              html += '<div><div class="price-site">' + (isBest ? '🏆 ' : '') + p.site + '</div>';
              html += '<div class="price-note">' + (p.shipping || '') + '</div></div>';
              html += '<div style="text-align:right"><div class="price-amount">$' + p.price.toFixed(2) + '</div>';
              if (savings) html += '<div class="savings-tag">Save $' + savings.toFixed(2) + '</div>';
              html += '</div></a>';
            }
            getEl('pricesList').innerHTML = html;
          }
        })
        .catch(function() {
          getEl('pricesList').innerHTML = '<div class="price-loading">Could not fetch prices. Use links below.</div>';
        });
    }

    function updateSiteLinks() {
      var html = '';
      for (var i = 0; i < LINK_SITES.length; i++) {
        var id = LINK_SITES[i];
        var site = SITES[id];
        html += '<a href="' + site.url(book.title, book.author, book.isbn) + '" target="_blank" class="site-btn">' + site.name + '</a>';
      }
      getEl('siteLinks').innerHTML = html;
    }

    function openMulti() {
      if (!book) return;
      for (var i = 0; i < MULTI_SITES.length; i++) {
        var id = MULTI_SITES[i];
        window.open(SITES[id].url(book.title, book.author, book.isbn), '_blank');
      }
      showToast('Opened 4 tabs!');
    }

    // Watchlist
    function saveBook() {
      if (!book) return;
      var inStore = parsePrice(getEl('inStoreInput').value);

      list.push({
        id: Date.now(),
        title: book.title,
        author: book.author,
        isbn: book.isbn,
        cover: book.cover,
        price: inStore
      });

      localStorage.setItem('bookList', JSON.stringify(list));
      updateBadge();
      showToast('Saved!');
    }

    function updateBadge() {
      getEl('wlBadge').textContent = list.length;
      getEl('wlBadge').classList.toggle('hide', list.length === 0);
    }

    function renderWatchlist() {
      if (list.length === 0) {
        getEl('wlContent').innerHTML = '<div class="wl-empty"><div style="font-size:2rem;margin-bottom:0.5rem">📚</div><p>No saved books</p></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        html += '<div class="wl-item">';
        html += '<div class="wl-item-top">';
        html += '<div class="wl-cover">' + (item.cover ? '<img src="' + item.cover + '">' : '📖') + '</div>';
        html += '<div class="wl-info">';
        html += '<div class="wl-item-title">' + escHtml(item.title) + '</div>';
        if (item.author) html += '<div class="wl-item-author">' + escHtml(item.author) + '</div>';
        if (item.price) html += '<span class="wl-tag">Beat $' + item.price.toFixed(2) + '</span>';
        html += '</div></div>';
        html += '<div class="wl-btns">';
        html += '<button class="wl-btn" onclick="removeItem(' + item.id + ')">Remove</button>';
        html += '<button class="wl-btn primary" onclick="searchItem(' + item.id + ')">🔍 Search</button>';
        html += '</div></div>';
      }
      getEl('wlContent').innerHTML = html;
    }

    window.searchItem = function(id) {
      var item = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) { item = list[i]; break; }
      }
      if (!item) return;
      getEl('searchInput').value = item.isbn || item.title;
      getEl('inStoreInput').value = item.price ? '$' + item.price.toFixed(2) : '';
      switchTab('search');
      doSearch();
    };

    window.removeItem = function(id) {
      list = list.filter(function(x) { return x.id !== id; });
      localStorage.setItem('bookList', JSON.stringify(list));
      updateBadge();
      renderWatchlist();
      showToast('Removed');
    };

    // Nav
    function switchTab(tab) {
      var navBtns = document.querySelectorAll('.nav-btn');
      for (var i = 0; i < navBtns.length; i++) {
        navBtns[i].classList.toggle('active', navBtns[i].getAttribute('data-tab') === tab);
      }
      getEl('searchSection').classList.toggle('hide', tab !== 'search');
      getEl('watchlist').classList.toggle('show', tab === 'watchlist');
      if (tab === 'watchlist') renderWatchlist();
    }

    // Utils
    function showToast(msg) {
      getEl('toast').textContent = msg;
      getEl('toast').classList.add('show');
      setTimeout(function() { getEl('toast').classList.remove('show'); }, 2000);
    }

    function parsePrice(s) {
      if (!s) return null;
      var n = parseFloat(s.replace(/[^0-9.]/g, ''));
      return isNaN(n) ? null : n;
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Start
    init();
  </script>
</body>
</html>
