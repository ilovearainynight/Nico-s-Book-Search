<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Book Price Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --card-alt: #f5f3f0;
      --text: #1a1816;
      --text-dim: #6b6560;
      --text-muted: #9a9590;
      --accent: #b8532f;
      --accent-hover: #9a4527;
      --border: #e5e0d8;
      --green: #1e7a35;
      --green-bg: #e5f5ea;
      --yellow: #9a6700;
      --yellow-bg: #fef6e6;
    }
    .dark {
      --bg: #141312;
      --card: #1f1d1c;
      --card-alt: #2a2725;
      --text: #f0ebe3;
      --text-dim: #a8a29e;
      --text-muted: #6b6560;
      --accent: #e07850;
      --accent-hover: #f08860;
      --border: #3d3935;
      --green: #4ade80;
      --green-bg: #14281a;
      --yellow: #fbbf24;
      --yellow-bg: #28200a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 1rem 1rem 6rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    h1 span { color: var(--accent); }

    .dark-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 1rem;
      cursor: pointer;
    }

    /* Search */
    .search-box {
      background: var(--card);
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    .search-input {
      flex: 1;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search-input::placeholder { color: var(--text-muted); }

    .search-btn {
      padding: 0 1.25rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .search-btn:hover { background: var(--accent-hover); }

    /* Book Card */
    .book-card {
      display: none;
      background: var(--card);
      border-radius: 14px;
      padding: 1.25rem;
      margin-top: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .book-card.show { display: block; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .book-top {
      display: flex;
      gap: 1rem;
    }

    .book-cover {
      width: 85px;
      height: 128px;
      border-radius: 6px;
      background: var(--card-alt);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 2.5rem;
    }
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info { flex: 1; min-width: 0; }

    .book-title {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }

    .book-author {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 0.625rem;
    }

    .book-isbn {
      display: inline-block;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
      background: var(--card-alt);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    /* In-store price */
    .in-store {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .in-store-label {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .in-store-input {
      width: 90px;
      padding: 0.5rem 0.625rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    .in-store-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .save-btn {
      margin-left: auto;
      padding: 0.5rem 0.875rem;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    .save-btn:hover {
      background: var(--accent);
      color: white;
    }

    /* PRICES SECTION */
    .prices-section {
      margin-top: 1rem;
    }

    .prices-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .prices-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .prices-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .price-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem;
      background: var(--card-alt);
      border-radius: 10px;
      margin-bottom: 0.5rem;
      text-decoration: none;
      color: inherit;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .price-item:hover {
      border-color: var(--accent);
    }
    .price-item.best {
      background: var(--green-bg);
      border-color: var(--green);
    }

    .price-left {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .price-site {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .price-note {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .price-right {
      text-align: right;
    }

    .price-amount {
      font-weight: 600;
      font-size: 1.1rem;
    }
    .price-item.best .price-amount {
      color: var(--green);
    }

    .price-shipping {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .price-loading {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .savings-tag {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 0.125rem 0.375rem;
      background: var(--green);
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      border-radius: 4px;
    }

    /* Fallback buttons */
    .fallback-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .fallback-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .site-btn {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }
    .site-btn:hover {
      background: var(--card-alt);
    }

    .multi-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.75rem;
      border: 1.5px solid var(--yellow);
      border-radius: 10px;
      background: var(--yellow-bg);
      color: var(--yellow);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .multi-btn:hover {
      background: var(--yellow);
      color: white;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 4rem;
      padding: 0.625rem 1rem;
      padding-bottom: calc(0.625rem + env(safe-area-inset-bottom));
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.125rem;
      padding: 0.25rem 0.5rem;
      border: none;
      background: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.65rem;
      cursor: pointer;
      position: relative;
    }
    .nav-btn .icon { font-size: 1.25rem; }
    .nav-btn.active { color: var(--accent); }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: white;
      font-size: 0.6rem;
      font-weight: 600;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge.hide { display: none; }

    /* Watchlist */
    .watchlist {
      display: none;
    }
    .watchlist.show { display: block; }

    .wl-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .wl-title {
      font-family: 'Fraunces', serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .wl-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .wl-empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.5; }

    .wl-item {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .wl-item-top {
      display: flex;
      gap: 0.75rem;
    }

    .wl-cover {
      width: 50px;
      height: 75px;
      border-radius: 4px;
      background: var(--card-alt);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .wl-cover img { width: 100%; height: 100%; object-fit: cover; }

    .wl-info { flex: 1; min-width: 0; }

    .wl-item-title {
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .wl-item-author {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .wl-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.375rem;
    }

    .wl-tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      background: var(--card-alt);
      border-radius: 4px;
      color: var(--text-dim);
    }
    .wl-tag.price {
      background: var(--yellow-bg);
      color: var(--yellow);
      font-weight: 500;
    }

    .wl-btns {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .wl-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .wl-btn:hover { background: var(--card-alt); }
    .wl-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .wl-btn.danger:hover { background: #fee2e2; color: #b91c1c; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: var(--bg);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Sections */
    .search-section { display: block; }
    .search-section.hide { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Book <span>Price Check</span></h1>
      <button class="dark-btn" id="darkBtn">🌙</button>
    </header>

    <!-- SEARCH -->
    <section class="search-section" id="searchSection">
      <div class="search-box">
        <div class="search-row">
          <input type="text" class="search-input" id="searchInput" placeholder="Title, author, or ISBN...">
          <button class="search-btn" id="searchBtn">🔍</button>
        </div>
      </div>

      <!-- Book Card -->
      <div class="book-card" id="bookCard">
        <div class="book-top">
          <div class="book-cover" id="bookCover">📖</div>
          <div class="book-info">
            <div class="book-title" id="bookTitle">Book Title</div>
            <div class="book-author" id="bookAuthor">by Author</div>
            <div class="book-isbn" id="bookIsbn">ISBN</div>
          </div>
        </div>

        <div class="in-store">
          <span class="in-store-label">In store:</span>
          <input type="text" class="in-store-input" id="inStoreInput" placeholder="$18.99" inputmode="decimal">
          <button class="save-btn" id="saveBtn">+ Save</button>
        </div>

        <!-- PRICES -->
        <div class="prices-section">
          <div class="prices-header">
            <span class="prices-title">💰 Best Prices Found</span>
            <span class="prices-status" id="pricesStatus"></span>
          </div>
          <div id="pricesList"></div>
        </div>

        <!-- Fallback -->
        <div class="fallback-section">
          <div class="fallback-title">Or check manually:</div>
          <div class="btn-row" id="siteLinks"></div>
          <button class="multi-btn" id="multiBtn">🚀 Open Top 4 Sites at Once</button>
        </div>
      </div>
    </section>

    <!-- WATCHLIST -->
    <section class="watchlist" id="watchlist">
      <div class="wl-header">
        <h2 class="wl-title">📚 Watchlist</h2>
        <button class="site-btn" id="randomBtn">🎲 Random</button>
      </div>
      <div id="wlContent"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="search">
      <span class="icon">🔍</span>
      Search
    </button>
    <button class="nav-btn" data-tab="watchlist">
      <span class="icon">📚</span>
      Watchlist
      <span class="badge hide" id="wlBadge">0</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    // === SITES CONFIG ===
    const SITES = {
      bwb: {
        name: 'Better World Books',
        icon: '🌍',
        note: 'Free shipping',
        url: (t, a, i) => `https://www.betterworldbooks.com/search/results?q=${enc(i||`${t} ${a||''}`.trim())}`
      },
      thriftbooks: {
        name: 'ThriftBooks',
        icon: '📚',
        note: 'Free ship $15+',
        url: (t, a, i) => `https://www.thriftbooks.com/browse/?b.search=${enc(i||`${t} ${a||''}`.trim())}#b.s=mostPopular-desc&b.p=1&b.pp=30&b.oos`
      },
      abebooks: {
        name: 'AbeBooks',
        icon: '📖',
        note: 'Sorted by price',
        url: (t, a, i) => i 
          ? `https://www.abebooks.com/servlet/SearchResults?isbn=${i}&sortby=17`
          : `https://www.abebooks.com/servlet/SearchResults?kn=${enc(t)}&sortby=17${a?`&an=${enc(a)}`:''}`
      },
      alibris: {
        name: 'Alibris',
        icon: '📕',
        note: 'Sorted by price',
        url: (t, a, i) => i 
          ? `https://www.alibris.com/search/books/isbn/${i}?sort=p`
          : `https://www.alibris.com/search/books/subject/Used?qwork=${enc(`${t} ${a||''}`.trim())}&sort=p`
      },
      bookfinder: {
        name: 'BookFinder',
        icon: '⭐',
        note: '100k+ sellers',
        url: (t, a, i) => i 
          ? `https://www.bookfinder.com/search/?isbn=${i}&mode=isbn&st=sr&ac=qr`
          : `https://www.bookfinder.com/search/?title=${enc(t)}${a?`&author=${enc(a)}`:''}&new_used=U&destination=us&currency=USD&mode=basic&st=sr&ac=qr`
      },
      amazon: {
        name: 'Amazon Used',
        icon: '📦',
        url: (t, a, i) => i
          ? `https://www.amazon.com/s?k=${i}&i=stripbooks&rh=p_n_condition-type%3A1294423011`
          : `https://www.amazon.com/s?k=${enc(`${t} ${a||''}`.trim())}&i=stripbooks&rh=p_n_condition-type%3A1294423011`
      }
    };

    const MULTI_SITES = ['thriftbooks', 'abebooks', 'bwb', 'alibris'];
    const LINK_SITES = ['bookfinder', 'thriftbooks', 'abebooks', 'alibris', 'amazon'];

    // CORS proxies to try (some may be rate limited or down)
    const CORS_PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
    ];

    // === STATE ===
    let list = JSON.parse(localStorage.getItem('bookList') || '[]');
    let dark = localStorage.getItem('bookDark') === 'true';
    let book = null;

    const $ = id => document.getElementById(id);
    const enc = s => encodeURIComponent(s || '');

    // === INIT ===
    function init() {
      if (dark) document.body.classList.add('dark');
      updateBadge();

      $('searchBtn').onclick = search;
      $('searchInput').onkeydown = e => e.key === 'Enter' && search();
      $('darkBtn').onclick = toggleDark;
      $('saveBtn').onclick = saveBook;
      $('multiBtn').onclick = openMulti;
      $('randomBtn').onclick = randomPick;

      document.querySelectorAll('.nav-btn').forEach(b => {
        b.onclick = () => switchTab(b.dataset.tab);
      });
    }

    // === SEARCH ===
    async function search() {
      const q = $('searchInput').value.trim();
      if (!q) return toast('Enter something to search');

      $('searchBtn').textContent = '...';
      $('pricesList').innerHTML = '<div class="price-loading">Searching for prices...</div>';
      $('pricesStatus').textContent = '';
      
      try {
        // Fetch from Google Books
        book = await fetchBook(q);
        
        // Update UI
        $('bookTitle').textContent = book.title || q;
        $('bookAuthor').textContent = book.author ? `by ${book.author}` : '';
        $('bookIsbn').textContent = book.isbn || 'No ISBN found';
        $('bookIsbn').style.display = book.isbn ? 'inline-block' : 'none';
        $('bookCover').innerHTML = book.cover ? `<img src="${book.cover}" alt="">` : '📖';
        
        // Update site links
        updateSiteLinks();
        
        $('bookCard').classList.add('show');
        
        // Fetch prices from multiple sources
        await fetchAllPrices();
        
      } catch (e) {
        console.error(e);
        toast('Search failed');
        $('pricesList').innerHTML = '<div class="price-loading">Could not fetch prices</div>';
      }
      
      $('searchBtn').textContent = '🔍';
    }

    async function fetchBook(query) {
      const cleanQuery = query.replace(/[-\s]/g, '');
      const isIsbn = /^[0-9]{10,13}$/.test(cleanQuery);
      const searchQ = isIsbn ? `isbn:${cleanQuery}` : query;
      
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${enc(searchQ)}&maxResults=1`);
      const data = await res.json();
      
      if (data.items?.[0]) {
        const v = data.items[0].volumeInfo;
        const ids = v.industryIdentifiers || [];
        return {
          title: v.title,
          author: v.authors?.join(', '),
          isbn: isIsbn ? cleanQuery : (ids.find(i => i.type === 'ISBN_13')?.identifier || ids.find(i => i.type === 'ISBN_10')?.identifier),
          cover: v.imageLinks?.thumbnail?.replace('http:', 'https:')
        };
      }
      
      return { title: query, author: null, isbn: isIsbn ? cleanQuery : null, cover: null };
    }

    async function fetchAllPrices() {
      const prices = [];
      const inStore = parsePrice($('inStoreInput').value);
      
      // 1. Better World Books (Open Library API) - this one works!
      if (book.isbn) {
        try {
          const res = await fetch(`https://openlibrary.org/prices?isbn=${book.isbn}`);
          const data = await res.json();
          if (data.betterworldbooks?.price_amt) {
            prices.push({
              site: 'Better World Books',
              price: parseFloat(data.betterworldbooks.price_amt),
              shipping: 'Free shipping',
              url: SITES.bwb.url(book.title, book.author, book.isbn),
              source: 'api'
            });
          }
        } catch (e) { console.log('BWB API error:', e); }
      }

      // 2. Try to scrape other sites via CORS proxy
      // ThriftBooks
      try {
        const tbPrice = await scrapeThriftBooks();
        if (tbPrice) prices.push(tbPrice);
      } catch (e) { console.log('ThriftBooks scrape failed:', e); }

      // 3. Try AbeBooks 
      try {
        const abPrice = await scrapeAbeBooks();
        if (abPrice) prices.push(abPrice);
      } catch (e) { console.log('AbeBooks scrape failed:', e); }

      // Sort by price
      prices.sort((a, b) => a.price - b.price);

      // Render prices
      if (prices.length === 0) {
        $('pricesList').innerHTML = '<div class="price-loading">No prices found via API. Use the links below to check manually.</div>';
        $('pricesStatus').textContent = '';
      } else {
        $('pricesStatus').textContent = `${prices.length} prices found`;
        $('pricesList').innerHTML = prices.map((p, i) => {
          const isBest = i === 0;
          const savings = inStore && p.price < inStore ? inStore - p.price : null;
          return `
            <a href="${p.url}" target="_blank" class="price-item ${isBest ? 'best' : ''}">
              <div class="price-left">
                <div>
                  <div class="price-site">${isBest ? '🏆 ' : ''}${p.site}</div>
                  <div class="price-note">${p.shipping || ''}</div>
                </div>
              </div>
              <div class="price-right">
                <div class="price-amount">$${p.price.toFixed(2)}</div>
                ${p.source === 'scraped' ? '<div class="price-shipping">⚡ live</div>' : ''}
                ${savings ? `<div class="savings-tag">Save $${savings.toFixed(2)}</div>` : ''}
              </div>
            </a>
          `;
        }).join('');
      }
    }

    async function scrapeThriftBooks() {
      if (!book.isbn) return null;
      
      const url = `https://www.thriftbooks.com/browse/?b.search=${book.isbn}`;
      
      for (const proxy of CORS_PROXIES) {
        try {
          const res = await fetch(proxy + encodeURIComponent(url), { 
            signal: AbortSignal.timeout(5000) 
          });
          const html = await res.text();
          
          // Look for price pattern in ThriftBooks HTML
          // They use data attributes or specific class patterns
          const priceMatch = html.match(/\$(\d+\.\d{2})/);
          if (priceMatch) {
            const price = parseFloat(priceMatch[1]);
            if (price > 0 && price < 500) { // sanity check
              return {
                site: 'ThriftBooks',
                price: price,
                shipping: 'Free ship $15+',
                url: SITES.thriftbooks.url(book.title, book.author, book.isbn),
                source: 'scraped'
              };
            }
          }
        } catch (e) { 
          console.log(`Proxy ${proxy} failed for ThriftBooks`); 
        }
      }
      return null;
    }

    async function scrapeAbeBooks() {
      if (!book.isbn) return null;
      
      const url = `https://www.abebooks.com/servlet/SearchResults?isbn=${book.isbn}&sortby=17`;
      
      for (const proxy of CORS_PROXIES) {
        try {
          const res = await fetch(proxy + encodeURIComponent(url), {
            signal: AbortSignal.timeout(5000)
          });
          const html = await res.text();
          
          // AbeBooks price patterns
          const priceMatch = html.match(/US\$\s*(\d+\.\d{2})/i) || html.match(/\$(\d+\.\d{2})/);
          if (priceMatch) {
            const price = parseFloat(priceMatch[1]);
            if (price > 0 && price < 500) {
              return {
                site: 'AbeBooks',
                price: price,
                shipping: '+ shipping',
                url: SITES.abebooks.url(book.title, book.author, book.isbn),
                source: 'scraped'
              };
            }
          }
        } catch (e) { 
          console.log(`Proxy ${proxy} failed for AbeBooks`); 
        }
      }
      return null;
    }

    function updateSiteLinks() {
      $('siteLinks').innerHTML = LINK_SITES.map(id => {
        const site = SITES[id];
        return `<a href="${site.url(book.title, book.author, book.isbn)}" target="_blank" class="site-btn">${site.icon} ${site.name}</a>`;
      }).join('');
    }

    function openMulti() {
      if (!book) return;
      MULTI_SITES.forEach(id => {
        window.open(SITES[id].url(book.title, book.author, book.isbn), '_blank');
      });
      toast('Opened 4 tabs!');
    }

    // === WATCHLIST ===
    function saveBook() {
      if (!book) return;
      const inStore = parsePrice($('inStoreInput').value);
      
      list.push({
        id: Date.now(),
        title: book.title,
        author: book.author,
        isbn: book.isbn,
        cover: book.cover,
        price: inStore,
        added: new Date().toISOString()
      });
      
      localStorage.setItem('bookList', JSON.stringify(list));
      updateBadge();
      toast('Saved!');
    }

    function updateBadge() {
      $('wlBadge').textContent = list.length;
      $('wlBadge').classList.toggle('hide', !list.length);
    }

    function renderWatchlist() {
      if (!list.length) {
        $('wlContent').innerHTML = `
          <div class="wl-empty">
            <div class="wl-empty-icon">📚</div>
            <p>No saved books yet</p>
          </div>`;
        return;
      }
      
      $('wlContent').innerHTML = list.map(item => `
        <div class="wl-item">
          <div class="wl-item-top">
            <div class="wl-cover">${item.cover ? `<img src="${item.cover}">` : '📖'}</div>
            <div class="wl-info">
              <div class="wl-item-title">${esc(item.title)}</div>
              ${item.author ? `<div class="wl-item-author">${esc(item.author)}</div>` : ''}
              <div class="wl-tags">
                ${item.price ? `<span class="wl-tag price">Beat $${item.price.toFixed(2)}</span>` : ''}
                ${item.isbn ? `<span class="wl-tag">${item.isbn}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="wl-btns">
            <button class="wl-btn danger" onclick="removeItem(${item.id})">Remove</button>
            <button class="wl-btn primary" onclick="searchItem(${item.id})">🔍 Search</button>
          </div>
        </div>
      `).join('');
    }

    window.searchItem = function(id) {
      const item = list.find(x => x.id === id);
      if (!item) return;
      $('searchInput').value = item.isbn || item.title;
      $('inStoreInput').value = item.price ? `$${item.price.toFixed(2)}` : '';
      switchTab('search');
      search();
    };

    window.removeItem = function(id) {
      list = list.filter(x => x.id !== id);
      localStorage.setItem('bookList', JSON.stringify(list));
      updateBadge();
      renderWatchlist();
      toast('Removed');
    };

    function randomPick() {
      if (!list.length) return toast('Save some books first!');
      const item = list[Math.floor(Math.random() * list.length)];
      searchItem(item.id);
    }

    // === NAV ===
    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => 
        b.classList.toggle('active', b.dataset.tab === tab)
      );
      $('searchSection').classList.toggle('hide', tab !== 'search');
      $('watchlist').classList.toggle('show', tab === 'watchlist');
      if (tab === 'watchlist') renderWatchlist();
    }

    // === UTILS ===
    function toggleDark() {
      dark = !dark;
      document.body.classList.toggle('dark', dark);
      localStorage.setItem('bookDark', dark);
      $('darkBtn').textContent = dark ? '☀️' : '🌙';
    }

    function toast(msg) {
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      setTimeout(() => $('toast').classList.remove('show'), 2000);
    }

    function parsePrice(s) {
      if (!s) return null;
      const n = parseFloat(s.replace(/[^0-9.]/g, ''));
      return isNaN(n) ? null : n;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    init();
  </script>
</body>
</html>
